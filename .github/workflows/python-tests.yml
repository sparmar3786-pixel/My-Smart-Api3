name: AI-TRADING CI

on:
  push:
    branches: [main, integrate-trading-research-v2-20261010, fix/commodity-footprint-ai-provider-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-trading-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: React/Vite source build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify frontend manifest
        run: |
          test -f package.json
          test -f package-lock.json
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) process.exit(1)"
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  backend:
    name: Optional Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect backend source
        id: detect
        shell: bash
        run: |
          if [ -f backend/requirements.txt ] && [ -d tests ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Python backend tests: this branch does not contain both backend/requirements.txt and tests/."
          fi
      - name: Install backend runtime dependencies
        if: steps.detect.outputs.available == 'true'
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        if: steps.detect.outputs.available == 'true'
        run: python -m unittest discover -s tests -v
      - name: Build backend Docker image
        if: steps.detect.outputs.available == 'true' && hashFiles('Dockerfile') != ''
        run: docker build --tag ai-trading-api:ci .
      - name: Explain backend test skip
        if: steps.detect.outputs.available != 'true'
        run: echo "No Python backend test suite is present on this branch; frontend CI still runs and must pass."
